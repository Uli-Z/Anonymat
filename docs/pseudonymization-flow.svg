<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
  <title id="title">How Anonymat works</title>
  <desc id="desc">Original text is reviewed and pseudonymized in your browser. Only the reviewed pseudonymized text is copied to an external AI tool. The returned text is restored locally using the original mapping, which stays on your device.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#147d73"/></marker>
    <marker id="aiArrow" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <style>
      text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#182b38}
      .zone{font-size:14px;font-weight:700;letter-spacing:1.6px}
      .title{font-size:17px;font-weight:700}
      .body{font-size:20px}
      .label{font-size:13px;font-weight:650}
      .note{font-size:13px;fill:#526576}
      .accent{fill:#147d73;font-weight:700}
      .card{fill:#fff;stroke:#c8d4db;stroke-width:1.2}
    </style>
  </defs>
  <rect x="2" y="2" width="956" height="546" rx="20" fill="#ffffff" stroke="#d2dce1"/>
  <rect x="16" y="16" width="450" height="518" rx="14" fill="#eaf7f4" stroke="#a4d3c9"/>
  <rect x="494" y="16" width="450" height="518" rx="14" fill="#f3f5f8" stroke="#c8d2dd" stroke-dasharray="5 4"/>
  <text x="36" y="47" class="zone" fill="#147d73">YOUR DEVICE · ANONYMAT</text>
  <text x="514" y="47" class="zone">EXTERNAL AI TOOL</text>
  <rect class="card" x="36" y="65" width="410" height="126" rx="10"/>
  <text class="title" x="54" y="93">1 · Original text</text>
  <text class="body" x="54" y="127"><tspan font-weight="700">Anna Müller</tspan> was admitted on</text>
  <text class="body" x="54" y="156" font-weight="700">12.03.2026.</text>
  <rect class="card" x="514" y="65" width="410" height="126" rx="10"/>
  <text class="title" x="532" y="93">2 · Pseudonymized text</text>
  <text class="body" x="532" y="127"><tspan class="accent">Lisa Weber</tspan> was admitted on</text>
  <text class="body accent" x="532" y="156">11.04.2026.</text>
  <path d="M446 128 H507" stroke="#147d73" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <rect x="36" y="209" width="410" height="92" rx="10" fill="#d3eee7"/>
  <text x="54" y="235" class="title" fill="#147d73">Detect · Review · Replace</text>
  <text x="54" y="260" class="note">Names and dates are replaced in your browser.</text>
  <text x="54" y="281" class="note">The original mapping stays on your device.</text>
  <rect x="514" y="209" width="410" height="92" rx="10" fill="#e6ebf1"/>
  <text x="532" y="235" class="title">Translate · Rewrite · Summarize</text>
  <text x="532" y="260" class="note">Only the reviewed text is copied manually</text>
  <text x="532" y="281" class="note">to the external tool for further processing.</text>
  <path d="M719 191 V209 M719 301 V318" stroke="#64748b" stroke-width="2" marker-end="url(#aiArrow)" fill="none"/>
  <rect class="card" x="514" y="325" width="410" height="126" rx="10"/>
  <text class="title" x="532" y="353">3 · AI response</text>
  <text class="body" x="532" y="387"><tspan class="accent">Lisa Weber</tspan> wurde am</text>
  <text class="body" x="532" y="416"><tspan class="accent">11.04.2026</tspan> aufgenommen.</text>
  <rect class="card" x="36" y="325" width="410" height="126" rx="10"/>
  <text class="title" x="54" y="353">4 · Restored text</text>
  <text class="body" x="54" y="387"><tspan font-weight="700">Anna Müller</tspan> wurde am</text>
  <text class="body" x="54" y="416"><tspan font-weight="700">12.03.2026</tspan> aufgenommen.</text>
  <path d="M514 387 H453" stroke="#147d73" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <text x="36" y="482" class="label" fill="#147d73">Restore original values locally</text>
  <text x="36" y="504" class="note">Using the mapping from the same browser session.</text>
  <text x="514" y="482" class="label">External processing is optional</text>
  <text x="514" y="504" class="note">Pseudonymization is not guaranteed anonymity.</text>
</svg>
