name: Publish stable release

# Release runs only when release notes change or manually dispatched.
on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: 'Explicitly replace the existing latest release and move its tag after tests'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use npm 11 (fix npm 10 peer-resolution crash)
        run: npm install --global npm@11.21.3 --no-audit --no-fund
      - name: Verify npm version
        run: npm --version
      - name: Generate full offline dictionaries
        working-directory: v2
        run: |
          python3 scripts/generate-city-lexicon.py
          python3 scripts/generate-ambiguity-lexicon.py
          python3 scripts/generate-person-street-lexica.py
      - name: Verify release build
        working-directory: v2
        run: |
          npm install --no-audit --no-fund
          npm run verify
          npm run test:e2e
      - name: Publish versioned single-file HTML and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_EXISTING: ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh_existing) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh release]')) }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./v2/package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "Refusing to publish a prerelease as stable: $VERSION" >&2
            exit 1
          fi
          cp v2/dist/index.html "anonymat-$VERSION.html"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [[ "$REFRESH_EXISTING" != "true" ]]; then
              echo "Release v$VERSION already exists; no changes made."
              exit 0
            fi
            LATEST=$(gh release view --json tagName --jq .tagName)
            [[ "$LATEST" == "v$VERSION" ]] || { echo "Refusing to refresh a non-latest release"; exit 1; }
            TAG_REF="refs/tags/v$VERSION"
            OLD_SHA=$(git ls-remote origin "$TAG_REF" | awk '{print $1}')
            [[ -n "$OLD_SHA" ]] || { echo "Existing release tag is missing"; exit 1; }
            git push --force-with-lease="$TAG_REF:$OLD_SHA" origin "$GITHUB_SHA:$TAG_REF"
            gh release upload "v$VERSION" "anonymat-$VERSION.html" --clobber
            gh release edit "v$VERSION" --notes-file RELEASE_NOTES.md --latest
            exit 0
          fi
          if [[ "$REFRESH_EXISTING" == "true" ]]; then
            echo "No existing release to refresh; refusing to create a new one."
            exit 1
          fi
          gh release create "v$VERSION" "anonymat-$VERSION.html" \
            --target "$GITHUB_SHA" \
            --title "Anonymat $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest
