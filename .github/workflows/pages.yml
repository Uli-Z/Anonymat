name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node for Anonymat 2
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Use npm 11 (fix npm 10 peer-resolution crash)
        run: npm install --global npm@11.21.3 --no-audit --no-fund
      - name: Verify npm version
        run: npm --version
      - name: Generate full European city gazetteer (build-time only)
        working-directory: v2
        run: python3 scripts/generate-city-lexicon.py
      - name: Derive ordinary-word/city homonyms (build time)
        working-directory: v2
        run: python3 scripts/generate-ambiguity-lexicon.py
      - name: Build name and street lexica (offline runtime)
        working-directory: v2
        run: python3 scripts/generate-person-street-lexica.py
      - name: Verify and build Anonymat 2
        working-directory: v2
        run: |
          npm install --no-audit --no-fund
          npm run verify
      - name: Prepare Pages site
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./v2/package.json').version")
          mkdir -p site/v2
          # Only the current Anonymat release is deployed; historical releases stay in GitHub Releases.
          cp v2/dist/index.html site/index.html
          cp v2/dist/index.html site/v2/index.html
          cp v2/dist/index.html "site/anonymat-$VERSION.html"
          cp v2/dist/index.html "site/v2/anonymat-$VERSION.html"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
